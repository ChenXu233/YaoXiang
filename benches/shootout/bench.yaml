# YaoXiang 多语言基准测试配置
# 用法: cargo run -p shootout [--bench <name>] [--lang <lang>]
#
# 每个 benchmark 通过 BENCH_INPUT 环境变量注入输入规模
# 所有语言实现均从 BENCH_INPUT 读取，无需 %i 模板替换
#
# ⚠ 读数可比性的已知差异（务必注意）：
#   - 其他语言（rust/cpp/go）用 `run: %o` 跑**编译产物**，读数为纯执行时间；
#   - YaoXiang 用 `run: %y run %s` 跑**源码**，读数**含编译开销**（实测约 65ms）。
#   故「yaoxiang 运行」一列不能与其他语言直接比较。
#
#   根因：配置用 `run: %y run %s` 跑源码（含编译）。**注**：实测 `run` 其实
#   接受 .42 字节码（`build %s -o %o` 后 `run %o` 可正常执行，输出一致），
#   故改为跑 .42 在技术上是可行的——但实测两者耗时相近（编译开销在总时间
#   中占比小），收益有限，故暂不改动以免引入「.42 与源码不同步」的风险。
#
#   当前用法：编译一列可独立比较；运行一列用于 YaoXiang 自身的**前后版本
#   对比**（同含编译开销，差值有效），不宜与 rust/go 横比。

benchmarks:
  fibonacci:
    description: "迭代斐波那契数列 — 整数运算和循环性能"
    warmup: 3
    runs: 10
    inputs: [20, 30, 40]
    languages:
      yaoxiang:
        src: src/fibonacci/fibonacci.yx
        compile: { cmd: "%y build %s -o %o" }
        run: { cmd: "%y run %s" }
      rust:
        src: src/fibonacci/fibonacci.rs
        compile: { cmd: "rustc -O %s -o %o" }
        run: { cmd: "%o" }
      python:
        src: src/fibonacci/fibonacci.py
        # 无 compile = 解释执行
        run: { cmd: "python %s" }
      cpp:
        src: src/fibonacci/fibonacci.cpp
        compile: { cmd: "g++ -O3 -o %o %s" }
        run: { cmd: "%o" }
      go:
        src: src/fibonacci/fibonacci.go
        compile: { cmd: "go build -o %o %s" }
        run: { cmd: "%o" }

  matrix:
    description: "矩阵乘法 — 嵌套循环和多维数组"
    warmup: 3
    runs: 10
    inputs: [10, 20, 50]
    languages:
      yaoxiang:
        src: src/matrix/matrix.yx
        compile: { cmd: "%y build %s -o %o" }
        run: { cmd: "%y run %s" }
      python:
        src: src/matrix/matrix.py
        run: { cmd: "python %s" }

  list_ops:
    description: "列表操作 — 列表创建、遍历、过滤和映射"
    warmup: 3
    runs: 10
    inputs: [100]
    languages:
      yaoxiang:
        src: src/list_ops/list_ops.yx
        compile: { cmd: "%y build %s -o %o" }
        run: { cmd: "%y run %s" }

  string_concat:
    description: "字符串拼接 — 字符串操作性能"
    warmup: 3
    runs: 10
    inputs: [100, 500, 1000]
    languages:
      yaoxiang:
        src: src/string_concat/string_concat.yx
        compile: { cmd: "%y build %s -o %o" }
        run: { cmd: "%y run %s" }