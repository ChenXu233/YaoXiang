allowBuilds:
  esbuild: true
overrides:
  # GHSA-r5fr-rjxr-66jc / GHSA-f23m-r3pf-42rh：lodash-es <=4.17.23 有原型污染等告警，
  # 4.18.0 起修复。消费链 mermaid@12.0.0 -> chevrotain@11.1.2 -> lodash-es（精确锁 4.17.23），
  # mermaid 最新版仍锁 chevrotain ~11.1.2，无法靠升级父依赖解决，故在此拉平。
  # chevrotain 与 dagre-d3-es 均只用 lodash-es 的基础工具函数，4.18.x 无 API 移除。
  lodash-es@<=4.17.23: ^4.18.1
  js-yaml@<4.1.1: ^4.1.1
  # advisories 的 "patched: None" 是元数据滞后：2.0.3/2.0.4 已修
  # （GHSA-5p2g-fcmc-qvqq / GHSA-w3rx-r6r6-pgpr）
  image-size@<=2.0.2: ^2.0.4
  # vite <6.4.3 的四项告警命中 vitepress 的 ^5.4.14 解析结果（5.4.21）；
  # 限定 5.x 内升级，避免跨大版本动 vitepress 的构建链
  vite@>=5.4.0 <6.4.3: ^6.4.3
  esbuild@<=0.24.2: ^0.25.0
  # GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 / GHSA-q2hr-2g5m-vwhr：
  # brace-expansion <5.0.12 的三项 DoS 告警（嵌套花括号递归 / 二次方展开，
  # 5.0.10、5.0.11、5.0.12 依次修复）。消费链 minimatch@10.2.x ->
  # brace-expansion。minimatch 声明的范围（^5.0.2 / ^5.0.8）本就容纳
  # 5.0.12，是入库 lockfile 把解析钉在 5.0.9；此处显式拉平，既修当前解析，
  # 也防止后续 install 再回退到受害版本。
  brace-expansion@<5.0.12: ^5.0.12
  # GHSA-r3ph-w7gj-g6xm / GHSA-r4xh-jqrq-34v2：js-yaml 5.2.3 的 maxTotalMergeKeys 不计数空
  # 映射（可构造出二次方 CPU），smol-toml 1.7.2 的 parseKey 每行重扫到文末（同为二次方）。
  # 消费链 markdownlint-cli@0.49.1 -> js-yaml / smol-toml；该包已是当前最新版，且用
  # ~5.2.1 / ~1.7.0 把解析锁在补丁位——上游不存在能顶到修复版的版本，故按大版本内拉平。
  js-yaml@>=5 <5.4.1: 5.4.1
  smol-toml@<1.9.0: 1.9.0
  # GHSA-238p-pmpm-9mq7：katex <0.18.2 会把继承自 Object.prototype 的 trust 当成显式授权
  # （绕过默认 false），前提是别处已污染原型。mermaid 12.2.0 已改 ^0.18.0，剩
  # micromark-extension-math@3.1.0（当前最新版）仍锁 ^0.16.0，故在此拉平到 0.18.2。
  katex@<0.18.2: 0.18.2
