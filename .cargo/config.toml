[build]
jobs = 8
# 默认目标目录
# target-dir = "target"

# =============================================================================
# 交叉编译配置（仅包含 CI 支持的目标）
# =============================================================================

# Linux ARM64 - CI 支持
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# Windows x86_64 - 使用 MSVC（与 CI 一致，推荐）
# 注意：Windows 交叉编译需要安装 mingw 工具链
# apt install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# macOS 交叉编译需要安装 Apple SDK 和工具链
# Linux: 需要使用 osxcross 或专门的工具链
# macOS: 使用系统 clang，无需额外配置
[target.x86_64-apple-darwin]
# linker = "clang"  # macOS 上默认使用系统 clang

[target.aarch64-apple-darwin]
# linker = "clang"  # macOS 上默认使用系统 clang

# =============================================================================
# 运行期 Z3 共享库查找（cargo runner）
# =============================================================================
#
# `build.rs` 把 libz3 复制到 <profile>，主程序与它同目录，加载没有问题。但
# cargo 1.100 起单元产物落在 `<profile>/build/<包名>/<哈希>/out`，`deps/` 不再
# 创建：测试与基准二进制各自散在哈希目录里，构建脚本无法预知这些路径，动态
# 链接的 libz3 在启动时找不到（Windows STATUS_DLL_NOT_FOUND / Linux 缺少共享
# 对象）。
#
# runner 在 cargo 运行任何产物（run / test / bench）前执行
# `scripts/dev/z3_runner.py`，把 `.z3` 资产里的共享库目录前置进
# PATH / LD_LIBRARY_PATH / DYLD_LIBRARY_PATH，再原样转交产物与退出码；找不到
# 资产时原样透传。脚本路径相对仓库根，从仓库根调用 cargo 即可。

[target.'cfg(windows)']
runner = "python scripts/dev/z3_runner.py"

[target.'cfg(unix)']
runner = "python3 scripts/dev/z3_runner.py"

# =============================================================================
# 优化配置
# =============================================================================

[profile.release]
# 链接时优化，减小二进制体积
lto = true
# 最高优化级别
opt-level = 3
# 剥离符号表
strip = true
# 单 codegen unit 以获得最佳优化
codegen-units = 1

# Debug 优化 - 保持调试信息但启用优化
[profile.dev]
opt-level = 1

# =============================================================================
# 依赖版本锁定（可选）
# =============================================================================

# =============================================================================
# Cargo Aliases
# =============================================================================

[alias]
# 运行 clippy 并检查测试文件
clippy-tests = "clippy --fix --allow-dirty --all --tests"

# [patch."https://github.com/rust-lang/crates.io-index"]
# 某些依赖可以指向本地路径或 fork
