[workspace]
members = ["benches/shootout/runner"]
exclude = ["wasm"]
resolver = "2"

[package]
name = "yaoxiang"
version = "0.7.11"
edition = "2021"
rust-version = "1.96"
description = "YaoXiang (爻象) Programming Language - A high-performance language with type-as-everything philosophy"
readme = "README.md"
license = "MIT"
authors = ["YaoXiang Team","ChenXu233 <Woyerpa@outlook.com>"]
repository = "https://github.com/ChenXu233/yaoxiang"

[features]
default = ["cli"]
wasm = []
cli = [
    "tokio", "rustyline", "lsp-server",
    "tempfile", "clap", "crossbeam",
    "tracing-subscriber",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "yaoxiang"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.8.1"
proptest = "1.11"

[[bench]]
name = "lib"
path = "benches/lib.rs"
harness = false

[[bench]]
name = "formatter"
path = "benches/formatter.rs"
harness = false

[dependencies]
# 日志 - tracing
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true }

# 并发和线程安全
crossbeam = { version = "0.8", optional = true }

# 数据结构
# ponytail: std::collections covers HashMap/HashSet; indexmap, hashbrown, smallvec unused

# 字符串处理
libloading = "0.9"
urlencoding = "2"

# 文件系统
tempfile = { version = "3.27.0", optional = true }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# 错误处理
anyhow = "1"
thiserror = "2.0.18"

# 命令行解析
clap = { version = "4.6.1", features = ["derive"], optional = true }

# REPL - 交互式编辑
rustyline = { version = "18.0.0", features = ["with-file-history", "with-dirs"], optional = true }

# 异步运行时
tokio = { version = "1.52.3", features = ["full"], optional = true }

# LSP - 语言服务器协议
lsp-types = "0.97"
lsp-server = { version = "0.10", optional = true }

# Wasm support - now handled via target-gated dependencies below

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1

[profile.dev]
debug = true

[profile.bench]
debug = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
