[workspace]
members = ["benches/shootout/runner", "tools/yx"]
exclude = ["wasm", "tools/setup-z3", "tools/code-tables"]
resolver = "2"

# RFC-037：工具链单一版本源（引擎 yaoxiang-rs 与前门 yx 同版本发布）
[workspace.package]
version = "0.8.1"

[package]
name = "yaoxiang"
version.workspace = true
edition = "2021"
rust-version = "1.96"
description = "YaoXiang (爻象) Programming Language - A high-performance language with type-as-everything philosophy"
readme = "README.md"
license = "MIT"
authors = ["YaoXiang Team","ChenXu233 <Woyerpa@outlook.com>"]
repository = "https://github.com/ChenXu233/yaoxiang"

[features]
default = ["cli"]
cli = [
    "rustyline", "lsp-server",
    "clap", "crossbeam-channel",
    "tracing-subscriber",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "yaoxiang-rs"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.8.1"
proptest = "1.11"
tempfile = "3.27.0"

[[bench]]
name = "lib"
path = "benches/lib.rs"
harness = false

[[bench]]
name = "formatter"
path = "benches/formatter.rs"
harness = false

[dependencies]
# 日志 - tracing
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true }

# 并发和线程安全
crossbeam-channel = { version = "0.5", optional = true }

# 数据结构
# ponytail: std::collections covers HashMap/HashSet; indexmap, hashbrown, smallvec unused

# 字符串处理
libloading = "0.9"
urlencoding = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# 语义化版本（RFC-014 Phase 3：替换手写解析器）
semver = "1"

# SHA-256 完整性校验（RFC-014 依赖表；替换内联手写实现）
sha2 = "0.10"

# .yxpkg 包格式（RFC-014a 决议 3：tar.gz 源码包 + SHA256SUMS）
flate2 = "1"
tar = "0.4"

# HTTP 客户端（RFC-014a Phase 4：GitHub 适配层；rustls 免 OpenSSL 交叉编译）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy"] }

# tokio 运行时（仅包管理命令层 drive()；current_thread + IO/时间驱动）
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

# 错误处理
anyhow = "1"
thiserror = "2.0.18"

# 命令行解析
clap = { version = "4.6.1", features = ["derive"], optional = true }

# REPL - 交互式编辑
rustyline = { version = "18.0.0", features = ["with-file-history", "with-dirs"], optional = true }

# LSP - 语言服务器协议
lsp-types = "0.97"
lsp-server = { version = "0.10", optional = true }

# Wasm support - now handled via target-gated dependencies below

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1

[profile.dev]
debug = true

[profile.bench]
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[build-dependencies]
code-tables = { path = "tools/code-tables" }
