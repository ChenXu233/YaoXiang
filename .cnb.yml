# CNB（备份仓库）侧的全部镜像逻辑。
#
# 两条方向，触发方式按「有没有事件可用」分别选：
#  1) CNB 上 open 的合并请求（多数由 NPC 发起）-> GitHub 的 cnb/pr-<编号> 分支与 PR。
#     新建 / 重开 / 源分支推送都是 CNB 自己的事件，用 pull_request.target 即刻镜像。
#     GitHub 侧的合并与关闭由 .github/workflows/cnb-sync.yml 按需戳 api_trigger 回关。
#  2) GitHub 主仓库的 dev/main 与全部 tag -> CNB。GitHub 的 push 由
#     .github/workflows/cnb-sync.yml 按需戳 api_trigger 增量回灌。
#
# 两个方向的按需通知都经 api_trigger 这一个入口，用构建变量 MIRROR_SCOPE 区分：
#  - repos：只回灌主干（GitHub push 触发）
#  - prs  ：只处理 PR 镜像与回关（GitHub 上镜像 PR 被合并/关闭触发）
#  - 空   ：页面手动点运行时两个方向都跑
#
# 定时只作兜底，按天一次：防 GitHub Actions 被禁用、CNB_TOKEN 轮换遗漏等导致
# 按需链路整体失效。日常同步不靠它，故不必更频繁。
#
# GitHub 凭据放在密钥仓库 ChenXu233/secrets 的 yaoxiang-pr-sync.yml（GH_USER / GH_TOKEN）。
# pull_request.target 属可信事件（代码版本取自目标分支、不做触发者权限检查），可以引用密钥；
# pull_request / pull_request.comment 等不可信事件不在此列。
#
# 镜像任务只做 git 与 curl，不吃 CPU：显式声明 cpus: 1，否则默认按 8 核计费。
dev:
  # 事件驱动：PR 新建 / 重开 / 源分支有新提交 -> 立刻镜像这一条。
  pull_request.target:
    - name: mirror-pr-on-event
      runner:
        cpus: 1
      imports:
        - https://cnb.cool/ChenXu233/secrets/-/blob/main/yaoxiang-pr-sync.yml
      stages:
        - name: mirror-prs
          script: bash .cnb/scripts/mirror-prs.sh

  # 兜底：按天一次，两个方向各跑一遍。幂等——已在 GitHub 合并的会回关 CNB PR，
  # 无新提交的直接跳过，GitHub 主干无变化则 push 报 everything up-to-date。
  "crontab: 17 3 * * *":
    - name: daily-mirror
      runner:
        cpus: 1
      imports:
        - https://cnb.cool/ChenXu233/secrets/-/blob/main/yaoxiang-pr-sync.yml
      stages:
        - name: sync-repos
          script: bash .cnb/scripts/mirror-repos.sh
        - name: mirror-prs
          script: bash .cnb/scripts/mirror-prs.sh

  # api_trigger：GitHub Actions 经 OpenAPI 戳这里做按需镜像（StartBuild，
  # event=api_trigger，构建变量 MIRROR_SCOPE 指定方向）。页面手动运行不带
  # MIRROR_SCOPE，则两个方向都跑。
  api_trigger:
    - name: on-demand-mirror
      runner:
        cpus: 1
      imports:
        - https://cnb.cool/ChenXu233/secrets/-/blob/main/yaoxiang-pr-sync.yml
      stages:
        - name: sync-repos
          script: |
            case "${MIRROR_SCOPE:-all}" in
              repos|all) bash .cnb/scripts/mirror-repos.sh ;;
              *)         echo "本轮跳过 GitHub -> CNB 主干回灌（scope=${MIRROR_SCOPE}）" ;;
            esac
        - name: mirror-prs
          script: |
            case "${MIRROR_SCOPE:-all}" in
              prs|all)  bash .cnb/scripts/mirror-prs.sh ;;
              *)        echo "本轮跳过 PR 镜像（scope=${MIRROR_SCOPE}）" ;;
            esac
