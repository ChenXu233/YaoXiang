# CNB（备份仓库）侧配置：把 GitHub 主仓库的分支与标签拉到 CNB。
#
# 方向固定为 GitHub -> CNB。CNB 不产生主干提交：NPC 的产出走 CNB 侧 PR，
# 由 .github/workflows/cnb-pr-mirror.yml 镜像到 GitHub 评审、合并，合并后的 dev 再由本任务回灌。
#
# 只推送分支与标签，不删除 CNB 上 GitHub 没有的引用——NPC 的工作分支与 CNB 侧 PR 分支必须保留。
# dev/main 若出现 GitHub 没有的提交（例如有人在 CNB 页面直接合并了 PR），任务以非零退出码停下
# 并打印这些提交，避免静默覆盖；先在 GitHub 侧对齐再等下一轮。
dev:
  # 每 30 分钟同步一次（POSIX cron，平台时区 Asia/Shanghai）。最小间隔 5 分钟。
  "crontab: */30 * * * *": &mirror-from-github
    - name: mirror-from-github
      stages:
        - name: pull-github-push-cnb
          script: |
            set -eu

            SRC="https://github.com/ChenXu233/YaoXiang.git"
            WORK="$(mktemp -d)"
            trap 'rm -rf "$WORK"' EXIT

            # 每次都从 GitHub 全量裸克隆：不依赖 CNB 工作区的克隆深度，避免浅克隆推送失败。
            git clone --bare --quiet "$SRC" "$WORK/gh.git"
            cd "$WORK/gh.git"

            # 用流水线临时令牌（CNB_TOKEN，随任务销毁）认证推送到本仓库。
            # 令牌只放在 credential helper 里，不拼进 URL，避免进日志。
            git config credential.helper '!f() { echo username=cnb; echo password="${CNB_TOKEN}"; }; f'

            # 先取回 CNB 现状，用于检测「CNB 领先 GitHub」的破坏性覆盖。
            git fetch --quiet "$CNB_REPO_URL_HTTPS" \
              '+refs/heads/dev:refs/cnb/dev' '+refs/heads/main:refs/cnb/main' || true

            for branch in dev main; do
              if git rev-parse --verify --quiet "refs/cnb/$branch" >/dev/null; then
                if ! git merge-base --is-ancestor "refs/cnb/$branch" "refs/heads/$branch"; then
                  echo "CNB 的 $branch 含有 GitHub 上没有的提交，停止同步以避免覆盖："
                  git log --oneline "refs/heads/$branch..refs/cnb/$branch" | head -n 20
                  echo "处理方式：先把这些改动落到 GitHub（或在 GitHub 合并对应 PR），再等下一轮定时任务。"
                  exit 1
                fi
              fi
            done

            git push --quiet --force "$CNB_REPO_URL_HTTPS" \
              'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

            echo "已同步 GitHub -> CNB：dev=$(git rev-parse --short refs/heads/dev) main=$(git rev-parse --short refs/heads/main)"

  # 手动触发一次（Open API 的 api_trigger，或页面上的运行按钮）；用于等不及下一轮定时。
  api_trigger: *mirror-from-github
