fail_fast: true
repos:
  - repo: local
    hooks:

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-fix
        name: cargo fix
        entry: cargo fix --all --allow-dirty
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy-fix
        name: cargo clippy --fix
        # 覆盖范围与 CI Check 步一致（--all --all-features），外加 --fix 自动修。
        # clippy-driver 产物指纹与 rustc 不同，用独立 target 目录避免污染缓存导致 cargo test 全量重编
        entry: cargo clippy --fix --allow-dirty --all --all-features --all-targets --target-dir target/clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy (门禁)
        # --fix 会让 -D warnings 失效，自动修不能当门禁：实测同一个 lint 在 --fix 下只报
        # warning（clippy 自陈「the clippy::doc_lazy_continuation lint ignores -D warnings」）
        # 并以 0 退出，去掉 --fix 才是 error/101。故修完必须再用不带 --fix 的口径挡一次。
        # 口径与 CI Check 步相同（--all --all-features -- -D warnings）；target 目录只影响缓存。
        entry: cargo clippy --all --all-features --target-dir target/clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      # 两段测试：第一段是快反馈（同一目标集的独立 testsuite 通道，带资源预算），
      # 第二段是拦提交的全量口径。两段的命令串与 AGENTS.md 常用命令区、
      # docs/src/dev/test-specification.md 规则 18.1、docs/src/dev/HOWTO.md
      # 提交前验证（改代码）由 scripts/ci/check-test-channel.py 机械对账，
      # 任一处口径不一致即红。
      - id: cargo-test-fast
        name: cargo test (fast 通道)
        entry: python scripts/dev/testsuite.py run fast
        language: system
        types: [rust]
        pass_filenames: false
        always_run: false
        stages: [pre-commit]

      - id: cargo-test
        name: cargo test (拦提交全量)
        entry: cargo test --all --quiet
        language: system
        types: [rust]
        pass_filenames: false
        always_run: false
        stages: [pre-commit]

      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --no-deps
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: sync-version-badge
        name: sync version badge to README
        entry: python scripts/hooks/sync-version-badge.py
        language: system
        files: '^(Cargo\.toml|README\.md|docs/gh/README\.en\.md)$'
        pass_filenames: false
        stages: [pre-commit]

      - id: markdownlint
        name: markdownlint docs
        # 只检查本次暂存的文件：原先写死 "docs/**/*.md" + pass_filenames: false 会 lint 全量文档，
        # 并发会话正在编辑 docs/ 时，钩子的 --fix 会改动对方未暂存的写入，
        # 与 pre-commit 的 stash 回滚冲突导致提交随机失败。
        # 注：显式传文件名时 markdownlint 会忽略 --ignore-path，故忽略目录改由 exclude 表达。
        # 手动全量检查用 pre-commit run markdownlint --all-files。
        entry: markdownlint --fix --config docs/.markdownlint.jsonc
        language: system
        files: '^docs/.*\.md$'
        types: [markdown]
        exclude: '^docs/(node_modules|public|dist|superpowers)/|^docs/src/\.vitepress/|^docs/src/(en|ja|ru|archive)/|^docs/src/design/rfc/(deprecated|rejected)/'
        stages: [pre-commit]

      - id: check-commit-msg
        name: check commit message format
        entry: python scripts/hooks/check-commit-msg.py
        language: system
        stages: [commit-msg]
        always_run: true

      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: check-soundness
        name: 健全性探针（阻塞）
        # 宽口径 E0–E5：check 通过 ⇒ run 不得出现词法/语法/类型/语义/代码生成/泛型/模块
        # 同族错误（WBS 0.6.3）。2026-11-06 翻闸：三类已知分叉归零 + 变异自证通过，
        # entry 由 --report-only 换成 --strict（有分叉即 exit 1，阻塞提交）；
        # --report-only 保留为手工排查形态，不进任何门禁。
        # 临时放过走 coding-rules 第五部分（// reason: + 计数进门禁报告），不得改回 report-only。
        # 只在暂存区含语料 .yx 或项目形态夹具时触发：378 条 × 2 次 CLI ≈ 30 s。
        # 项目形态层（tests/project-corpus/）必须一并匹配——它是本探针唯一的真实判据面，
        # 漏匹配就等于「改夹具时门禁不跑」，同一类洞会在新层复现。
        entry: python scripts/ci/check-soundness.py --strict
        language: system
        files: '^(tests/yaoxiang/.*\.yx|src/std/tests/.*\.yx|tests/yaoxiang-multifile/.*\.yx|tests/project-corpus/.*)$'
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
