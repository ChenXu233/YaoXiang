fail_fast: true
repos:
  - repo: local
    hooks:

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-fix
        name: cargo fix
        entry: cargo fix --all --allow-dirty
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        # clippy 逻辑在脚本中（独立 target 目录隔离缓存）；依赖 bash 在 PATH 中，
        # Windows 用户需将 Git Bash 的 bin 目录加入 PATH，否则报 Executable 'bash' not found
        entry: bash scripts/hooks/cargo-clippy.sh
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all --quiet
        language: system
        types: [rust]
        pass_filenames: false
        always_run: false

      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --no-deps
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false

      - id: sync-version-badge
        name: sync version badge to README
        entry: python scripts/hooks/sync-version-badge.py
        language: system
        files: '^(Cargo\.toml|README\.md|docs/gh/README\.en\.md)$'
        pass_filenames: false

      - id: markdownlint
        name: markdownlint docs
        entry: markdownlint "docs/**/*.md" --fix --config docs/.markdownlint.jsonc --ignore-path docs/.markdownlintignore
        language: system
        types: [text]
        pass_filenames: false

      - id: check-commit-msg
        name: check commit message format
        entry: python scripts/hooks/check-commit-msg.py
        language: system
        stages: [commit-msg]
        always_run: true
