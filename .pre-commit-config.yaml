fail_fast: true
repos:
  - repo: local
    hooks:

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-fix
        name: cargo fix
        entry: cargo fix --all --allow-dirty
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --fix --allow-dirty --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        # clippy-driver 产物指纹与 rustc 不同，会污染主 target 缓存导致 cargo test 全量重编
        env:
          CARGO_TARGET_DIR: target/clippy

      - id: cargo-test
        name: cargo test
        entry: cargo test --all --quiet
        language: system
        types: [rust]
        pass_filenames: false
        always_run: false

      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --no-deps
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false

      - id: sync-version-badge
        name: sync version badge to README
        entry: python scripts/hooks/sync-version-badge.py
        language: system
        files: '^(Cargo\.toml|README\.md|docs/gh/README\.en\.md)$'
        pass_filenames: false

      - id: markdownlint
        name: markdownlint docs
        entry: markdownlint "docs/**/*.md" --fix --config docs/.markdownlint.jsonc --ignore-path docs/.markdownlintignore
        language: system
        types: [text]
        pass_filenames: false

      - id: check-commit-msg
        name: check commit message format
        entry: python scripts/hooks/check-commit-msg.py
        language: system
        stages: [commit-msg]
        always_run: true
