# Dist Release（RFC-037）——发版单点
#
# 基于 cargo-dist 0.32.0 生成的工作流改造（生成物 vendor 进仓库接受 review）：
# * push main 驱动：gate 读 Cargo.toml 版本 → `v{version}` tag 不存在才放行
# * 门禁沿用旧 release.yml：cargo audit + fmt/clippy/单测/doc test 全过才打 tag
# * 打 tag 后才构建：`cargo dist build`（plan job 计算各 target 的 runner 矩阵与交叉编译依赖）
# * 逐 target 跑 scripts/release/package-dist.sh 重组为 bin/ + lib/ 结构并重算 checksum
# * 发布：generate-commit-list.ts 生成 merge-commit changelog body，上传重组包，
#   `action-gh-release` 自建 Release；apt 仓库另发 GitHub Pages
#
# 为什么门禁与打 tag 在本文件而不在 release.yml：tag push 触发本 workflow 的方案不可行
# ——tag 由 workflow 用 GITHUB_TOKEN 推送，而 GITHUB_TOKEN 的推送不触发任何 workflow。
# 旧 release.yml 因此只能自己发布扁平二进制，故整体并入本文件并删除（含 _build-platforms.yml）。
#
# 与生成版的差异：去掉 pull_request 触发 / host / announce / global artifacts
# （installers = []，无全局产物）；触发与门禁自有；外挂 wasm 与 Inno Setup job。

name: Dist Release

permissions:
  "contents": "write"

concurrency:
  group: dist-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild/re-publish (e.g. v0.8.2)'
        required: true
        type: string

jobs:
  # ── 版本门：push main 按 Cargo.toml 版本决定是否发版；手动触发按输入 tag 重发 ──
  gate:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.check.outputs.should_release }}
      create-tag: ${{ steps.check.outputs.create_tag }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: Resolve version and tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            # 手动重发：tag 已存在，只重建重发
            TAG="${{ inputs.tag }}"
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
              || { echo "tag $TAG not found" >&2; exit 1; }
            SHOULD=true
            CREATE=false
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
            TAG="v$VERSION"
            # 末尾锚定：防 v0.8.2 匹配到 v0.8.20。先查本地 tag（fetch-depth: 0 已拉全
            # tags），再回退 ls-remote 防 checkout 未取 tags
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
              || git ls-remote --tags origin "$TAG" | grep -q "refs/tags/$TAG$"; then
              echo "Tag $TAG already exists, skipping release"
              SHOULD=false
              CREATE=false
            else
              SHOULD=true
              CREATE=true
            fi
          fi
          {
            echo "should_release=$SHOULD"
            echo "create_tag=$CREATE"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

  # ── 门禁（与旧 release.yml 一致）：全过才打 tag ──────────────────
  security:
    name: Security Audit
    needs: gate
    if: needs.gate.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Run audit
        run: cargo audit

  test:
    name: Test
    needs: gate
    if: needs.gate.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-test-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-test-${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --all --all-features --all-targets -- -D warnings

      - name: Run tests
        run: |
          # 先产出普通可执行文件：`cargo test --lib --bins` 只构建测试壳，
          # 不落 target/debug/yaoxiang-rs，stdlib 文档门禁会找不到解释器。
          # （同 ci.yml MSRV job，V0.8.1 发版时已踩过一次）
          cargo build --all-features --bins
          cargo test --all-features --lib --bins

      - name: Doc tests
        run: cargo test --doc --all-features

  # ── 打 tag：门禁通过后 ubuntu-22.04 上产生 v{version}（重发路径已存在则跳过）──
  tag:
    name: Create and push tag
    needs: [gate, security, test]
    if: needs.gate.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create and push tag
        if: needs.gate.outputs.create-tag == 'true'
        run: |
          TAG="${{ needs.gate.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  # ── dist plan：计算构建矩阵（target/runner/系统依赖） ──────────
  plan:
    name: Plan dist build
    needs: [gate, tag]
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ needs.gate.outputs.tag }}
      version: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 按 gate 解析出的 tag 检出，保证构建内容与 tag 一致
          ref: refs/tags/${{ needs.gate.outputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - id: plan
        run: |
          dist plan --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # ── 逐 target 构建 + 重组打包 ───────────────────────────────────
  build-local-artifacts:
    name: build (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      # runner / dist-args / install_dist / packages_install 由 dist 计算
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch plan manifest
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          dist build --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Package restructured release archive
        shell: bash
        run: |
          bash scripts/release/package-dist.sh \
            "${{ needs.plan.outputs.version }}" \
            "${{ join(matrix.targets, '-') }}"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            target/distrib/yaoxiang-*
            ${{ env.BUILD_MANIFEST_NAME }}

  # ── Wasm（独立交付物：playground，与 RFC-037 决议一致不迁入 dist）──
  build-wasm:
    name: Build Wasm
    needs:
      - plan
    uses: ./.github/workflows/_build-wasm.yml
    with:
      artifact-name: yaoxiang-wasm
      retention-days: 30

  # ── Inno Setup 向导（既有资产转正；吃重组包，不二次编译）─────────
  build-installer:
    name: Windows Installer (Inno Setup)
    needs:
      - plan
      - build-local-artifacts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Fetch restructured windows package
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*x86_64-pc-windows-msvc*
          path: pkg
          merge-multiple: true
      - name: Extract package
        run: |
          $zip = Get-ChildItem "pkg" -Filter "yaoxiang-*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "pkg\extracted"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        # PkgDir 相对 .iss 所在目录解析（scripts/build/），须上溯到仓库根
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.plan.outputs.version }} /DPkgDir=..\..\pkg\extracted\yaoxiang-${{ needs.plan.outputs.version }}-x86_64-pc-windows-msvc scripts/build/setup.iss'
      - name: "Upload installer"
        uses: actions/upload-artifact@v7
        with:
          name: yaoxiang-windows-installer
          # OutputDir=..\dist 同样相对 .iss 所在目录解析 → scripts/dist/
          path: scripts/dist/YaoXiang-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # ── 发布：merge-commit changelog body + 追加上传（发布保持现状）──
  publish:
    name: Publish to GitHub Release
    needs: [plan, build-local-artifacts, build-wasm, build-installer]
    if: ${{ always() && needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.build-installer.result == 'success' && !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # generate-commit-list.ts 走 Node 原生类型剥离，需 22.18+；
      # ubuntu-22.04 自带 node 18，必须显式装
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # 下载失败必须让 job 失败：容忍会产出"零资产静默发布"的绿色 Release
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Get previous tag
        id: prev-tag
        run: |
          # 只在版本 tag 里找前驱，防 nightly 这类非版本 tag 混入 changelog 范围
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -vx "${{ needs.plan.outputs.tag }}" | head -1)
          echo "value=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV"
      - name: Generate commit list with @mentions
        run: |
          node scripts/release/generate-commit-list.ts \
            --from-tag "${{ steps.prev-tag.outputs.value }}" \
            --to-tag "${{ needs.plan.outputs.tag }}" \
            --changelog CHANGELOG.md \
            > final-release-body.md
      - name: Append assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          body_path: final-release-body.md
          files: |
            release-artifacts/**/yaoxiang-*.tar.gz
            release-artifacts/**/yaoxiang-*.zip
            release-artifacts/**/yaoxiang-*.sha256
            release-artifacts/**/yaoxiang-*.deb
            release-artifacts/**/yaoxiang-wasm/**
            release-artifacts/**/YaoXiang-Setup-*.exe
          fail_on_unmatched_files: false

  # ── apt 仓库元数据发布（GitHub Pages 静态仓库；RFC-037 阶段四）──
  # 需要 repo secret APT_GPG_KEY（ASCII armored 私钥）；未配置时本 job 跳过，
  # 其余渠道不受影响。Pages 需指向 apt-repo 分支根部（见 docs 安装指南）。
  publish-apt:
    name: Publish apt repository
    needs: [plan, build-local-artifacts, publish]
    if: ${{ always() && needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: apt-repo
          fetch-depth: 0
        continue-on-error: true
        id: apt-branch
      - uses: actions/checkout@v7
        if: steps.apt-branch.outcome != 'success'
        with:
          fetch-depth: 0
      - name: Import GPG key
        id: gpg
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "APT_GPG_KEY not configured; skipping apt repository publish"
          else
            echo "$APT_GPG_KEY" | base64 -d | gpg --batch --import
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect debs
        if: steps.gpg.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: incoming
          merge-multiple: true
      - name: Build apt repo metadata
        if: steps.gpg.outputs.skip == 'false'
        run: |
          mkdir -p dists/stable/main/binary-amd64 dists/stable/main/binary-arm64 pool
          cp -f incoming/yaoxiang-*.deb pool/
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          apt-ftparchive packages pool >> dists/stable/main/binary-arm64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-arm64/Packages
          apt-ftparchive release dists/stable > dists/stable/Release
          gpg --armor --export > KEY.gpg
          gpg --batch --yes --clearsign --output dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --detach-sign --armor --output dists/stable/Release.gpg dists/stable/Release
      - name: Push apt-repo branch
        if: steps.gpg.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pages 分支只含仓库元数据与 deb 池。分支不存在时孤儿化重建（从触发
          # ref 全量回退检出的源码树不得进分支）；已存在时同样清空索引再只加
          # 元数据——顺带自愈任何历史遗留的源码树条目
          if ! git rev-parse --verify apt-repo >/dev/null 2>&1; then
            git checkout --orphan apt-repo
          fi
          git rm -r -q --cached .
          git add KEY.gpg dists pool
          git commit -m ":package: apt repo: $VERSION" || exit 0
          git push origin HEAD:apt-repo
