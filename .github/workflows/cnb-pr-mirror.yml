name: CNB PR Mirror

# 备份仓库（cnb.cool/ChenXu233/YaoXiang）上 open 的合并请求——多数由 NPC 发起——镜像到本仓库，
# 评审、CI 与合并都在 GitHub 完成；合并后由本工作流关闭 CNB 侧同编号的 PR。
# 数据方向：CNB PR -> GitHub PR（单向）；合并结果由 CNB 的定时任务（.cnb.yml）回灌到 CNB 的 dev/main。
#
# 注意：GitHub 的定时工作流只在默认分支（main）上调度，所以本文件必须同时存在于 main。

on:
  schedule:
    # 每 15 分钟一次（GitHub 定时任务最小 5 分钟，实际触发可能有延迟）
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: cnb-pr-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror CNB pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 脚本与 dev 同源：工作流本身必须在默认分支（main）才能按 schedule 调度，
      # 但实现放在 dev，这里固定检出 dev，避免两份脚本各自漂移。
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Sync CNB pull requests to GitHub
        env:
          CNB_REPO: ChenXu233/YaoXiang
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          # 用 PAT（细粒度：contents + pull-requests 写）时 PR 由人触发，检查自动运行；
          # 未配置时回退到 GITHUB_TOKEN——PR 由 Actions 自身创建，PR 上的检查会停在「等待批准」，
          # 脚本改为显式派发一次 ci.yml，并把运行链接评论到 PR 上。
          GH_TOKEN: ${{ secrets.CNB_SYNC_PAT || github.token }}
          SYNC_PAT_PRESENT: ${{ secrets.CNB_SYNC_PAT != '' }}
        run: python3 .github/scripts/cnb-pr-mirror.py
