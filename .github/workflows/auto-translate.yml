name: Auto Translate Docs

on:
  push:
    paths:
      - 'docs/src/**/*.md'
      - 'docs/vpi18n.config.json'
      - 'docs/glossary.json'
    branches:
      - dev

jobs:
  translate:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-translate-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install
        working-directory: docs

      - name: Create .env for vpi
        run: |
          cat > .env << EOF
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_MODEL=${{ secrets.AI_MODEL || 'MiniMax-M2.7-highspeed' }}
          AI_BASE_URL=${{ secrets.AI_BASE_URL || 'http://101.132.38.216:3000/v1' }}
          EOF
        working-directory: docs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}

      - name: Validate secrets
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "ERROR: AI_API_KEY secret is required but not set"
            exit 1
          fi
          echo "Secrets validated successfully"
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Translate documents
        run: npx vpi gen
        working-directory: docs

      - name: Clean up orphaned translations
        run: node scripts/cleanup-translations.mjs
        working-directory: docs

      - name: Install markdown tools
        run: npm install -g prettier markdownlint-cli

      # 中英两侧都要处理。中文侧此前无人调用 format:md，
      # docs/src/** 的格式约定（表格对齐、围栏空行）完全靠人工维持。
      # zh 侧用 --check（只报告不改动）：CI 里没有本地 prettier 可供比对，
      # 让流水线自动改中文源码会在 bot 提交里混入大批与翻译无关的格式 diff。
      - name: Format translated Markdown files
        continue-on-error: true
        run: |
          prettier --write "docs/src/en/**/*.md" --config docs/.prettierrc.json
          prettier --check  "docs/src/**/*.md"  --config docs/.prettierrc.json

      # markdownlint：修掉「吞掉退出码」这个真 bug。
      # 此前是 `|| echo "::warning::..."`，自接上以来从未真正拦住过任何东西。
      #
      # 仍然用 continue-on-error 阻塞主流程，原因是本次改动无法在本地验证
      # 中文侧能否通过 —— markdownlint 只在 CI 里 `npm install -g` 装，
      # 仓库的 docs/package.json 没把它列为依赖，node_modules 里也没有。
      # 直接去掉 `||` 会让这条从未跑过的检查第一次真正生效，风险未知。
      # 待本地装上 markdownlint 并把基线清零后，把 continue-on-error 去掉即可。
      # 排除范围统一交给 docs/.markdownlintignore（已含 node_modules、
      # .vitepress、dist、en、archive、rfc/deprecated、rfc/rejected）。
      - name: Lint Markdown
        continue-on-error: true
        run: |
          markdownlint "docs/src/en/**/*.md" --config docs/.markdownlint.jsonc
          markdownlint "docs/src/**/*.md" --config docs/.markdownlint.jsonc \
            --ignore-path docs/.markdownlintignore

      - name: Commit translations
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/src/en/ docs/src/.i18n-cache.json docs/vpi18n.config.json
          git diff --staged --quiet || git commit -m ":pencil: docs: auto-translate documentation"
          git pull --rebase origin dev
          git push
