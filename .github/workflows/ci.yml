name: CI

on:
  push:
    branches: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            .z3
          key: check-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            check-${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --all --all-features -- -D warnings

      - name: Build check
        run: cargo check --all-features

  scripts:
    name: Scripts (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # scripts/**/*.ts 走 Node 原生类型剥离，需 22.18+
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # scripts/ 无依赖清单之外的东西；i18n 测试另需 vitest
      - name: Install script deps
        run: npm ci --prefix scripts --ignore-scripts

      - name: Install i18n test deps
        run: npm ci --prefix scripts/i18n --ignore-scripts

      - name: Typecheck
        run: npm run typecheck --prefix scripts

      # 这些用例此前只在本地跑（CI 无 Node 步骤），
      # 扁平键那类「结构性错误」正是它们在守
      - name: Run i18n tests
        run: npm test --prefix scripts/i18n

  docs-truth:
    name: Docs Truth (事实对账)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 原有两道文档门禁都判「时间」而非「事实」，因此对最严重的一类问题
      # （文档与源码矛盾）完全无感：
      #   - check-docs-freshness.sh 用 git mtime 判定，2026-09-25 一次批量格式化
      #     就把 20+ 篇过期文档的 mtime 全部刷新，STALE 归零；
      #   - check_tracking.py 的 RFC 状态由目录反查，frontmatter 与目录不一致
      #     永远查不出。
      # 下面两个脚本改为对账事实。详见
      # docs/plans/2026-10-02-docs-audit-and-structure-proposal.md
      - name: Check docs against source of truth
        run: python3 scripts/ci/check-docs-truth.py

      - name: Check docs structure (orphan / frontmatter / dead link)
        run: python3 scripts/ci/check-docs-orphan.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-truth-reports
          path: |
            scripts/ci/_docs-truth-report.txt
            scripts/ci/_docs-orphan-report.txt
          if-no-files-found: ignore

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            .z3
          key: test-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features --lib --bins --test integration --test yx_runner

      - name: Doc tests
        run: cargo test --doc --all-features

      - name: Build CLI
        run: cargo build --all-features --bin yaoxiang-rs

      # 教程/指南里的代码块直接被读者复制粘贴，必须真能编译。
      # 2026-10-02 审计实测发现 20 个示例用 0.8.2 编译器直接失败，
      # 而当时没有任何门禁覆盖这件事（stdlib 侧有，教程侧空白）。
      # 依赖上面已构建的 CLI，无需重复编译。
      - name: Check tutorial/guide code examples compile
        run: python3 scripts/ci/check-docs-examples.py

      - name: Upload example report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-examples-report
          path: scripts/ci/_docs-examples-report.txt
          if-no-files-found: ignore

      - name: YaoXiang test suites (JSON summary)
        run: |
          BIN=target/debug/yaoxiang-rs
          "$BIN" test --json --parallel > target/report-corpus.json || corpus_rc=$?
          "$BIN" test --json --parallel src/std/tests > target/report-stdlib.json || stdlib_rc=$?
          CORPUS_RC="${corpus_rc:-0}" STDLIB_RC="${stdlib_rc:-0}" python3 - <<'EOF'
          import json
          import os

          suites = [
              ("corpus", int(os.environ.get("CORPUS_RC", "0"))),
              ("stdlib", int(os.environ.get("STDLIB_RC", "0"))),
          ]
          reports = {}
          for name, _ in suites:
              with open(f"target/report-{name}.json", encoding="utf-8") as f:
                  reports[name] = json.load(f)

          lines = [
              "### yaoxiang test",
              "",
              "| suite | total | passed | failed | skipped | time (s) |",
              "|---|---|---|---|---|---|",
          ]
          for name, _ in suites:
              s = reports[name]["summary"]
              lines.append(
                  f"| {name} | {s['total']} | {s['passed']} | {s['failed']} "
                  f"| {s['skipped']} | {s['time_secs']} |"
              )
          lines.append("")
          for name, _ in suites:
              by_kind = reports[name]["summary"]["by_kind"]
              kind_text = ", ".join(f"{k}={v}" for k, v in by_kind.items())
              lines.append(f"- {name} by kind: {kind_text}")
          text = "\n".join(lines)
          print(text)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(text + "\n")

          failures = []
          for name, _ in suites:
              for entry in reports[name]["files"]:
                  if not entry["passed"]:
                      stderr = entry.get("stderr") or ""
                      failures.append(
                          f"[{name}] {entry['file']} [{entry['kind']}]"
                          f" exit={entry.get('exit_code')}\n{stderr}"
                      )
          if failures:
              print("\n".join(failures))
          if failures or any(rc != 0 for _, rc in suites):
              rc_text = " ".join(f"{name}_rc={rc}" for name, rc in suites)
              print(f"::error::yaoxiang test failed ({rc_text})")
              raise SystemExit(1)
          EOF

  test-msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Get MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            .z3
          key: msrv-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            msrv-${{ runner.os }}-cargo-

      - name: Check MSRV compatibility
        run: |
          cargo check --all-features
          cargo fmt --check --all
          cargo clippy --all --all-features -- -D warnings

      - name: Test with MSRV
        run: |
          # 先产出普通可执行文件：`cargo test --lib --bins` 只构建测试壳，
          # 不落 target/debug/yaoxiang-rs，stdlib 文档门禁会找不到解释器。
          cargo build --all-features --bins
          cargo test --all-features --lib --bins
