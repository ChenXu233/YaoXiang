name: Build Wasm (Reusable)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact name'
        type: string
        default: 'yaoxiang-wasm'
      retention-days:
        description: 'Artifact retention days'
        type: number
        default: 30

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # 从固定的 z3-wasm Release 取预编译静态库（不用 Actions artifact：
      # artifact 有 90 天有效期，过期后这里会静默降级成「无 Z3」）。
      # 仓库为 private 时需带 token；public 下匿名 URL 即可，token 无害。
      - name: Download Z3 wasm (prebuilt from release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .z3/z3-4.16.0-wasm
          URL="https://github.com/${{ github.repository }}/releases/download/z3-wasm/z3-wasm-4.16.0.tar.gz"
          if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/z3-wasm.tar.gz "$URL"; then
            tar xzf /tmp/z3-wasm.tar.gz -C .z3/z3-4.16.0-wasm
            echo "Z3 wasm 已就位：$(du -sh .z3/z3-4.16.0-wasm | cut -f1)"
          else
            # 取不到就降级，但必须显式告警：静默降级正是这个仓库踩过的坑
            echo "::warning::Z3 wasm 构件下载失败（$URL）——本次构建无 Z3"
          fi

      - name: Verify Z3 wasm
        run: |
          if [ -f ".z3/z3-4.16.0-wasm/lib/libz3.a" ]; then
            echo "Z3 wasm found"
            echo "### Z3 wasm: 已链接" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::未找到 .z3/z3-4.16.0-wasm/lib/libz3.a，本次 wasm 构建不含 Z3"
            echo "### ⚠ Z3 wasm: 缺失（构建未含 Z3）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-

      - name: Build Wasm
        run: cd wasm && wasm-pack build --target web --out-name yaoxiang --out-dir ../pkg

      - name: Package wasm
        run: cd pkg && zip -r ../yaoxiang-wasm.zip .

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: yaoxiang-wasm.zip
          retention-days: ${{ inputs.retention-days }}
