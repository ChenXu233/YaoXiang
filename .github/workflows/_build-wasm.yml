name: Build Wasm (Reusable)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact name'
        type: string
        default: 'yaoxiang-wasm'
      retention-days:
        description: 'Artifact retention days'
        type: number
        default: 30

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # 从固定的 z3-wasm Release 取预编译静态库（不用 Actions artifact：
      # artifact 有 90 天有效期，过期后这里会静默降级成「无 Z3」）。
      # 仓库为 private 时需带 token；public 下匿名 URL 即可，token 无害。
      - name: Download Z3 wasm (prebuilt from release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .z3/z3-4.16.0-wasm
          URL="https://github.com/${{ github.repository }}/releases/download/z3-wasm/z3-wasm-4.16.0.tar.gz"
          if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/z3-wasm.tar.gz "$URL"; then
            tar xzf /tmp/z3-wasm.tar.gz -C .z3/z3-4.16.0-wasm
            echo "Z3 wasm 已就位：$(du -sh .z3/z3-4.16.0-wasm | cut -f1)"
          else
            # #435：无 Z3 的 wasm 形态不受支持（语言核心功能残缺）——直接失败，
            # 不再降级（build.rs 也会 panic 拦截，此处提前给出可读错误）
            echo "::error::Z3 wasm 构件下载失败（$URL）——wasm 构建必须带 Z3（#435）"
            exit 1
          fi

      - name: Verify Z3 wasm
        run: |
          if [ -f ".z3/z3-4.16.0-wasm/lib/libz3.a" ]; then
            echo "Z3 wasm found"
            echo "### Z3 wasm: 已链接" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::未找到 .z3/z3-4.16.0-wasm/lib/libz3.a——wasm 构建必须带 Z3（#435）"
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-

      - name: Build Wasm
        run: cd wasm && wasm-pack build --target web --out-name yaoxiang --out-dir ../pkg

      # #435：wasm 形态 SMT 端到端实证——Z3 必须在 wasm 里真实求解，
      # 而非「库链了但没人用」的静默空链（历史事故形态：cfg 排除下 extern
      # 零引用，静态库不被拉取，Verify 步照样绿）。断言完整 solve 路径
      # （DeclareConst + 比较断言 + CheckSat + Unsat 判定）的返回签名。
      - name: SMT end-to-end proof (Z3 alive in wasm)
        run: |
          cd wasm && wasm-pack build --dev --target nodejs --out-name yaoxiang --out-dir ../target/pkg-smt-check
          node -e "
            const yx = require('../target/pkg-smt-check/yaoxiang.js');
            const r = yx.test_smt();
            if (r !== 'unsat (z3 alive)') {
              console.error('SMT 实证失败：期望 unsat (z3 alive)，实际', JSON.stringify(r));
              process.exit(1);
            }
            console.log('SMT 实证通过：Z3 在 wasm 下真实求解（unsat 判定正确）');
          "

      - name: Package wasm
        run: cd pkg && zip -r ../yaoxiang-wasm.zip .

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: yaoxiang-wasm.zip
          retention-days: ${{ inputs.retention-days }}
