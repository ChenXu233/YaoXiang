name: Nightly

on:
  schedule:
    - cron: '17 22 * * *'
  # 支持手动触发：本 workflow 曾连续 8 天失败而无人重跑（只能等次日 cron），
  # 修完也无从验证。加此入口后改动可当场跑一遍确认。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # RFC-037：nightly 构建切到 cargo dist build + package-dist.sh（与正式版同一套），
  # 兼作新流水线的 24h 验证面；发布逻辑保持不变（覆盖 nightly Pre-release）
  plan:
    name: Plan dist build
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - id: plan
        run: |
          dist plan --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build:
    name: Cross-platform Build (${{ join(matrix.targets, ', ') }})
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      # runner / dist-args / install_dist / packages_install 由 dist 计算
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    timeout-minutes: 60
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch plan manifest
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          dist build --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Package restructured release archive
        shell: bash
        run: |
          # Debian 的 Version 必须以数字开头（policy §5.6.12），旧字面量
          # "nightly" 会让 dpkg-deb 直接拒绝、整个 Package 步骤失败。
          #
          # 但只补成固定的 "0.8.1-nightly" 也不够：nightly 每夜都是不同提交，
          # 版本串相同则 dpkg 判 SAME → apt 认为「已是最新」，用户永远拿不到
          # 次日的构建。故后缀必须随构建变化。
          #
          # 用 run number + attempt 作排序键：二者单调递增（重跑时 attempt +1），
          # 新构建一定排在旧构建之上，不会被误判成降级；末尾附短 sha 便于对照提交。
          # 不能只放 sha：sha 无时序，相邻构建约半数会判成降序（dpkg 报
          # downgrading）。dpkg 对数字段按数值比（9 < 10），无需补零。
          VERSION="$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          bash scripts/release/package-dist.sh \
            "$VERSION-nightly.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.${GITHUB_SHA:0:7}" \
            "${{ join(matrix.targets, '-') }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: yaoxiang-nightly-${{ join(matrix.targets, '_') }}
          path: |
            target/distrib/yaoxiang-*-nightly.*
            ${{ env.BUILD_MANIFEST_NAME }}
          retention-days: 14

  build-wasm:
    name: Build Wasm
    uses: ./.github/workflows/_build-wasm.yml
    with:
      artifact-name: yaoxiang-nightly-wasm
      retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Run audit
        run: cargo audit

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 显式 checkout dev：schedule 事件走**默认分支**（main），而代码落在 dev 上。
      # 照默认分支测，每晚测的都是同一个提交（main 上次动是 2026-10-12，此后
      # 八个 nightly 测的是同一棵树），趋势图会是一条直线。只影响基准 job 测什么：
      # release 构件仍按原样来自默认分支，报告头会写明这层归属。
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-cargo-

      - name: Run benchmarks
        run: cargo bench --all-features 2>&1 | tee benchmark-output.txt

      # 归因元数据（sha/ref/机器）：入库与报告头都要它，缺了就无从判断
      # 读数变化是代码还是环境引起的
      - name: Write run meta
        if: always()
        run: python3 scripts/ci/bench-meta.py --kind benchmark --out target/bench-meta-benchmark.json

      # Criterion 的 estimates.json 是结构化结果，跨 nightly 可直接比较；
      # bench-report.sh 汇总成 Markdown 进 Step Summary，并产出 JSON 供追踪。
      - name: Summarize benchmarks
        if: always()
        run: |
          # 报告生成器崩溃必须让本 step 变红：只用 tee 时管道退出码取自 tee，
          # 脚本失败会被吞成绿色（2026-10-20 nightly 的 shootout 汇总即如此）。
          set -o pipefail
          bash scripts/ci/bench-report.sh \
            --out-json target/bench-results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            target/criterion/
            target/bench-results.json
            target/bench-meta-benchmark.json
            benchmark-output.txt
          retention-days: 30

  # 多语言横比（shootout）：测的是同一问题在不同语言下的耗时，
  # 与上面 Criterion（Yaoxiang 自身微基准）互补——前者看相对位置，
  # 后者看自身回归。结果写进 nightly release notes（见 publish job）。
  shootout:
    name: Shootout (multi-language)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 同 benchmark job：显式 checkout dev，否则每晚测的都是默认分支那一个提交
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}

      # shootout 需要各语言工具链来编译对照实现。缺哪个就跳哪个，
      # runner 自身对编译失败是「跳过该语言」而非中断，故此处也逐个装、
      # 不因某个包不可用而中断整个 job。
      - name: Install comparison toolchains
        run: |
          sudo apt-get update -qq
          for pkg in g++ golang-go python3; do
            sudo apt-get install -y --no-install-recommends "$pkg" \
              || echo "::warning::[$pkg] 安装失败，对应语言将被跳过"
          done
          # 记录实际可用的工具链（便于从日志判断某个语言为何缺席）
          for t in g++ go python3 rustc; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-8s %s\n' "$t" "$("$t" --version 2>&1 | head -1)"
            else
              echo "::warning::[$t] 不在 PATH，对应语言将被跳过"
            fi
          done

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: shootout-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            shootout-${{ runner.os }}-cargo-

      # 先构建 release 二进制：runner 默认用它（--yaoxiang-bin），
      # 且 bench.toml 的 compile 步骤也走 %y → 同一个二进制。
      - name: Build yaoxiang (release)
        run: cargo build --release --bin yaoxiang-rs

      - name: Run shootout
        run: |
          set -o pipefail
          # 不要 `2>&1`：cargo 的彩色/进度信息（CARGO_TERM_COLOR=always）会
          # 经此一并写进 benchmark-output.txt，最终颜色转义码被搬进 release notes。
          # 结构化的结果走 --out-json，人读输出留在日志里即可。
          cargo run -p shootout --release -- \
            --out-json target/shootout-results.json | tee shootout-output.txt

      - name: Write run meta
        if: always()
        run: python3 scripts/ci/bench-meta.py --kind shootout --out target/bench-meta-shootout.json

      - name: Summarize
        if: always()
        run: |
          # 同 benchmark job：不能把报告生成器的失败吞进 tee 的 0。
          set -o pipefail
          bash scripts/ci/bench-report.sh \
            --shootout-json target/shootout-results.json \
            --shootout shootout-output.txt \
            --out-json target/shootout-report.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shootout-results
          path: |
            shootout-output.txt
            target/shootout-results.json
            target/shootout-report.json
            target/bench-meta-shootout.json
          retention-days: 30

  # 把两类基准结果追加进仓库内的性能历史（benches/history/*.jsonl），并派生
  # 图表数据。**由 nightly 自己提交**：artifact 只留 30 天、nightly 的
  # Pre-release 每晚被删掉重建，两者都不是档案；写进仓库后 git log -p
  # benches/history/ 就能把性能变化与代码改动对应起来。
  #
  # 为什么单独一个 job 而不是在两个基准 job 里各推一次：同一时刻只应有一次推送，
  # 两个 job 各推一次会互相 non-fast-forward 打架。数据由 artifact 带过来。
  #
  # 提交回 dev（基准 job checkout 的正是 dev）；推送用的是默认 GITHUB_TOKEN，
  # GitHub 的防递归规则下不会触发新的 workflow run，[skip ci] 只是双保险。
  bench-history:
    name: Perf history (commit)
    needs: [benchmark, shootout]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Download benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: '*results*'
          path: bench-artifacts

      - name: Append to history
        id: append
        run: |
          set -uo pipefail
          rc=0
          # artifact 内部层次随 upload-artifact 的路径推断变化，故按文件名搜
          CRIT_JSON="$(find bench-artifacts -name bench-results.json -print -quit)"
          CRIT_META="$(find bench-artifacts -name bench-meta-benchmark.json -print -quit)"
          SHOOT_JSON="$(find bench-artifacts -name shootout-results.json -print -quit)"
          SHOOT_META="$(find bench-artifacts -name bench-meta-shootout.json -print -quit)"
          echo "criterion: ${CRIT_JSON:-<缺失>} / meta ${CRIT_META:-<缺失>}"
          echo "shootout:  ${SHOOT_JSON:-<缺失>} / meta ${SHOOT_META:-<缺失>}"

          # 一套失败时仍记录另一套：缺数据比脏数据更不可挽回
          if [[ -n "$CRIT_JSON" ]]; then
            args=()
            [[ -n "$CRIT_META" ]] && args+=(--meta "$CRIT_META")
            python3 scripts/ci/bench-history.py --kind criterion \
              --criterion-json "$CRIT_JSON" "${args[@]}" \
              --history-dir benches/history || rc=1
          else
            echo "::warning::criterion 结果缺失，本次不记入历史"
            rc=1
          fi
          if [[ -n "$SHOOT_JSON" ]]; then
            args=()
            [[ -n "$SHOOT_META" ]] && args+=(--meta "$SHOOT_META")
            python3 scripts/ci/bench-history.py --kind shootout \
              --shootout-json "$SHOOT_JSON" "${args[@]}" \
              --history-dir benches/history || rc=1
          else
            echo "::warning::shootout 结果缺失，本次不记入历史"
            rc=1
          fi
          python3 scripts/ci/bench-history.py --render-chart \
            --history-dir benches/history \
            --out docs/src/public/perf/history.json || rc=1
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benches/history docs/src/public/perf/history.json
          if git diff --cached --quiet; then
            echo "历史无变化，跳过提交"
            exit 0
          fi
          git commit -m ":wrench: chore(bench): nightly 性能数据入库 [skip ci]"
          # 与 auto-translate bot 抢 dev 时拉平重试。nightly 跑在 UTC 22:17，
          # 该时段通常无人提交，正常一次即中。
          for i in 1 2 3 4 5; do
            if git push origin HEAD:dev; then
              echo "第 $i 次推送成功"
              exit 0
            fi
            git pull --rebase origin dev
          done
          echo "::error::五次推送均失败（dev 上持续有并发提交）"
          exit 1

      # 数据已经落库并推送，此时才让 job 变红：入库与报警分开，避免报警把数据一起吞掉
      - name: Fail if any suite was missing
        if: steps.append.outputs.rc != '0'
        run: |
          echo "::error::有基准套件缺失结果，本次历史不完整（详见 Append to history 日志）"
          exit 1

  # 把上述两类基准结果汇总为一段 Markdown，供 publish job 注入
  # nightly release 的 body。
  bench-notes:
    name: Benchmark notes
    needs: [benchmark, shootout]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: '*results*'
          path: bench-artifacts

      - name: Compose notes
        run: |
          # 传 artifact 根目录即可：脚本会自动向下查找 criterion 目录
          # 与 shootout 输出（artifact 内部层次不稳定，不写死）。
          # 报告头要写明测于哪个提交：基准 job 显式 checkout dev，而本次
          # release 的构件来自默认分支——不点明，读者会把 dev 的数字当成
          # release 构件的数字
          META="$(find bench-artifacts -name bench-meta-benchmark.json -print -quit)"
          bash scripts/ci/bench-report.sh \
            --criterion-dir bench-artifacts/benchmark-results \
            --shootout-json bench-artifacts/shootout-results/target/shootout-results.json \
            --shootout bench-artifacts/shootout-results/shootout-output.txt \
            --meta "$META" \
            > bench-notes.md
          cat bench-notes.md

      - name: Upload notes
        uses: actions/upload-artifact@v7
        with:
          name: bench-notes
          path: bench-notes.md
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN }}
          components: llvm-tools

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --quiet

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: coverage-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            coverage-${{ runner.os }}-cargo-

      - name: Generate coverage
        run: cargo llvm-cov --all-features --html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 30

  publish:
    name: Publish Nightly Pre-release
    needs: [build, build-wasm, bench-notes]
    # 构建失败必须让 publish 失败并不能执行：旧 nightly release 会先被删掉，
    # `if: always()` 下再发一个缺平台的残缺版——正是「零资产静默发布」的同构
    # 缺陷（dist-release.yml 已修过同类）。本轮 Linux 全挂却发布绿色就是此因。
    # benchmark / bench-notes 失败不阻断（它们只影响 body，已按「存在则追加」处理）。
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.build-wasm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Delete old nightly tag
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -d nightly || true
          git push origin --delete nightly || true

      - name: Create nightly tag
        run: |
          git tag nightly
          git push origin nightly

      - name: Delete old nightly release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes || true

      - name: Download all artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      # 传了 files 却一个没匹配上，说明构件根本没下来（构建失败或命名漂移）。
      # 此处不发空 release，直接失败——残缺/空版比不发更坑人。
      - name: Verify artifacts downloaded
        run: |
          count=$(find release-artifacts -type f -name 'yaoxiang-*' | wc -l)
          echo "found $count release artifacts"
          find release-artifacts -type f -name 'yaoxiang-*' | head -20
          [ "$count" -gt 0 ] || { echo "::error::no release artifacts downloaded"; exit 1; }

      # 拼装 release body：先写头部，再附基准结果（若 bench-notes job 产出）。
      # bench-notes 用 `if: always()` 但不保证有数据，故此处按「存在则追加」处理。
      - name: Compose release body
        run: |
          {
            echo "> ⚠️ **这是自动构建的 nightly 版本，仅供测试使用，可能不稳定。**"
            echo
            echo "Automated nightly build from commit ${{ steps.sha.outputs.short }}"
          } > release-body.md

          NOTES="release-artifacts/bench-notes/bench-notes.md"
          if [[ -f "$NOTES" ]]; then
            printf '\n---\n\n' >> release-body.md
            cat "$NOTES" >> release-body.md
          else
            printf '\n---\n\n> 基准结果未生成（benchmark / shootout job 可能失败或被跳过）。\n' \
              >> release-body.md
          fi

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly Pre-release"
          body_path: release-body.md
          prerelease: true
          files: |
            release-artifacts/**/yaoxiang-*
          fail_on_unmatched_files: false
